[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elecgnn"
version = "0.1.0"
description = "Graph neural networks for liquid-electrolyte property prediction across MD and experimental data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Minhee Park" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "rdkit>=2023.9",
    "torch>=2.1",
    "torch-geometric>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]
figures = ["matplotlib>=3.7"]
baselines = ["lightgbm>=4.0", "xgboost>=2.0", "shap>=0.44"]

[project.scripts]
elecgnn = "elecgnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
